<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Hex Shield -->
  <polygon points="128,16 226,68 226,172 128,240 30,172 30,68" 
           fill="url(#shieldGrad)" 
           stroke="url(#accentGrad)" 
           stroke-width="4" 
           filter="url(#glow)" />

  <!-- Inner Geometric Frame -->
  <polygon points="128,40 204,82 204,160 128,216 52,160 52,82" 
           fill="none" 
           stroke="rgba(255,255,255,0.12)" 
           stroke-width="2" />

  <!-- Dynamic Risk Pulse Line -->
  <polyline points="75,145 105,145 120,95 136,165 151,120 162,145 185,145" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="6" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

  <!-- Data Nodes -->
  <circle cx="75" cy="145" r="4" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <circle cx="120" cy="95" r="4" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <circle cx="136" cy="165" r="4" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
  <circle cx="151" cy="120" r="4" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <circle cx="185" cy="145" r="4" fill="#ffffff" stroke="#10b981" stroke-width="2" />
</svg>
