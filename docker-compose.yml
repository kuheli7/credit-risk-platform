services:
  credit-risk-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neostats_credit_risk_platform
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./backend:/app/backend
      - ./src:/app/src
      - ./frontend:/app/frontend
    # Use the checked-in template as a clean-clone fallback.
    env_file:
      - .env.example
    environment:
      IS_DOCKER: "true"
      DATA_DIR: /app/data
      MODEL_DIR: /app/models
      DB_PATH: /app/data/credit_risk.db
      GROQ_API_KEY: ${GROQ_API_KEY:-your_groq_api_key_here}
    restart: unless-stopped
